name: AppimageTest

on:
  push:
    branches:
      - linux-appimage

jobs:
  build-and-release:
    name: Build and Release [test]
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          chmod +x ./scripts/linux/install_dependencies.sh
          ./scripts/install_dependencies.sh

      - name: Compile (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          make clean
          make linux

      - name: Package (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          chmod +x ./scripts/linux/package.sh
          ./scripts/package.sh
