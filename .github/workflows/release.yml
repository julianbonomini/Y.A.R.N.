name: Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha'
    branches:
      - linux-release

jobs:
  build-and-release:
    name: Build and Release
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dependencies
      - name: Set up dependencies (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          chmod +x ./scripts/install-requirements-macos.sh
          ./scripts/install-requirements-macos.sh

      - name: Set up dependencies (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          chmod +x ./scripts/install-requirements-linux.sh
          ./scripts/install-requirements-linux.sh

      # Build
      - name: Build (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          make clean && make macos

      - name: Build (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          make clean && make linux
      

      # Package
      - name: Package .app (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          app_name="YARN"
          echo "Removing quarentine flag for: ${app_name}.app:"
          xattr -cr "${app_name}.app"
          mkdir -p release/macos
          echo "Zip: ${app_name}.app -> release/macos/${app_name}-${{ github.ref_name }}.zip:"
          zip -r release/macos/${app_name}-${{ github.ref_name }}.zip "${app_name}.app"
          echo "Removing quarentine flag for: release/macos/${app_name}-${{ github.ref_name }}.zip:"
          xattr -cr "release/macos/${app_name}-${{ github.ref_name }}.zip"

      - name: Package binary (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          mkdir -p release/linux
          cp build/linux/YARN release/linux/YARN
          tar czvf release/linux.tar.gz -C release/linux .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/linux/*.tar.gz
            release/macos/*.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
